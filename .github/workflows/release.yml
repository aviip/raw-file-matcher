
name: Automatic Electron Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Calculate Version and Create Release
    runs-on: ubuntu-latest

    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create semantic release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.platform }}
    needs: release
    if: needs.release.outputs.published == 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            command: --win nsis
            extension: exe

          - platform: macOS
            os: macos-latest
            command: --mac dmg
            extension: dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout release version
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package Electron application
        run: npx electron-builder ${{ matrix.command }} --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-installer
          path: release/*.${{ matrix.extension }}
          if-no-files-found: error

  publish:
    name: Publish Release Assets
    needs: [release, build]
    if: needs.release.outputs.published == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Download Windows and macOS installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
